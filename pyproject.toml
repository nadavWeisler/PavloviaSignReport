[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PavloviaSignReport"
version = "0.1.0"
description = "Generate participant Word reports from Pavlovia CSV exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nadav Weisler" }]
dependencies = [
  "pandas>=2.2.2",
  "Pillow>=10.4.0",
  "python-docx>=1.1.2",
  "tqdm>=4.66.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.11.12",
]

[project.scripts]
pavlovia-sign-report = "pavlovia_sign_report.cli:main"

[tool.setuptools.packages.find]
include = ["pavlovia_sign_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
